aid: withclutch
name: Clutch
description: 'Clutch (withclutch.com) is a US fintech that builds digital origination
  and lending automation software exclusively for credit unions. The platform spans
  consumer loan origination, deposit and business account opening, an omnichannel banker
  workstation (Fulfillment), an automated decisioning engine (Fastlane), targeted remarketing,
  data insights, and AI assistants — HAL for lending and Emma for collections — packaged
  as the Clutch Lending Automation System (LAS). Clutch integrates with credit union
  cores, loan origination systems such as MeridianLink Consumer LOS (LoansPQ), digital
  banking platforms and decisioning vendors, and reports powering origination for roughly
  150 credit unions including six of the ten largest in the United States. Its customer-facing
  data surface is a File Transfer API and SFTP delivery for daily CSV exports covering
  lending, account opening, funding, NACHA and HAL conversation datasets; the API reference
  itself sits behind the customer support login.'
