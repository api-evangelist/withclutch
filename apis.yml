apis:
- name: Clutch Data Exports File Transfer API
  description: 'Clutch delivers daily origination datasets to credit union customers
    over either SFTP or a File Transfer API. The public knowledge base documents the
    datasets (lending, account opening, funding, NACHA, HAL), their field-level data
    dictionaries, the CSV format (pipe-delimited, double-quoted) and the 11:00 UTC
    daily generation cadence with one-week retention. The File Transfer API reference
    article itself requires a customer support login, so no base URL, authentication
    scheme or endpoint list is publicly readable and no machine-readable spec is published.'
  humanURL: https://support.withclutch.com/support/solutions/articles/153000254486-data-exports-api-vs-sftp-delivery
  tags:
  - Data Exports
  - File Transfer
  - Reporting
