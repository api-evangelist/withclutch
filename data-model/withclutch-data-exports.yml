summary: Clutch publishes field-level data dictionaries for the five daily datasets it delivers to credit
  union customers over SFTP or the File Transfer API. This artifact captures those dictionaries verbatim
  from the public knowledge base and derives the entity graph that links them. No OpenAPI is published,
  so the graph is built from the documented identifier fields rather than from spec $refs.
delivery:
  channels:
  - SFTP
  - File Transfer API
  format: csv, pipe-delimited, double-quoted
  cadence: generated daily at 11:00 UTC
  retention: one week
  files_per_dataset: two CSVs — past 1 day and past 30 days, identical field structure
  reference: https://support.withclutch.com/support/solutions/articles/153000254486-data-exports-api-vs-sftp-delivery
  api_reference:
    url: https://support.withclutch.com/support/solutions/articles/153000248800
    http_status: 302
    access: customer support login required
